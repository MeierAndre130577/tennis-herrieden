name: BTV Daten holen

on:
  # Alle 10 Minuten, täglich – das Skript prüft selbst ob ein Spiel im Zeitfenster liegt
  # (1h vor bis 10h nach Spielbeginn). Außerhalb: sofortiger Exit, ~0 Rechenzeit.
  schedule:
    - cron: '*/10 * * * *'
  # Manuell auslösbar (z.B. für Tests)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Playwright + Chromium installieren
        run: npx playwright install chromium --with-deps

      - name: BTV Daten holen
        run: node scripts/fetch-btv.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TZ: Europe/Berlin
