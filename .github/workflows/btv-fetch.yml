name: BTV Daten holen

on:
  # Alle 10 Minuten – Skript prüft selbst ob Spiel im Zeitfenster liegt
  schedule:
    - cron: '*/10 * * * *'
    # Täglich 02:00 UTC (03:00 MEZ / 04:00 MESZ) – Heimspielplan aktualisieren
    - cron: '0 2 * * *'
  # Manuell auslösbar – optional nur Mannschaften laden
  workflow_dispatch:
    inputs:
      teams_only:
        description: 'Nur Mannschaften laden (kein Match-Fetch)'
        required: false
        default: 'false'
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Playwright + Chromium installieren
        run: npx playwright install chromium --with-deps

      - name: BTV Daten holen
        run: node scripts/fetch-btv.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TZ: Europe/Berlin
          TEAMS_ONLY: ${{ inputs.teams_only || (github.event.schedule == '0 2 * * *' && 'true' || 'false') }}
