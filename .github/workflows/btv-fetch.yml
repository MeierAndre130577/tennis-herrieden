name: BTV Daten holen

on:
  # Alle 30 Minuten – Skript prüft selbst ob Spiel im Zeitfenster liegt
  schedule:
    - cron: '*/30 * * * *'
    # Täglich 02:00 UTC (03:00 MEZ / 04:00 MESZ) – Heimspielplan aktualisieren
    - cron: '0 2 * * *'
  # Manuell auslösbar – optional nur Mannschaften laden
  workflow_dispatch:
    inputs:
      teams_only:
        description: 'Nur Mannschaften laden (kein Match-Fetch)'
        required: false
        default: 'false'
        type: string
      players_only:
        description: 'Nur Spieler-Meldelisten laden (1x pro Saison)'
        required: false
        default: 'false'
        type: string
      players_group_id:
        description: 'groupId der Staffel (für players_only)'
        required: false
        default: ''
        type: string
      players_team_name:
        description: 'BTV-Teamname der Heimmannschaft (für players_only)'
        required: false
        default: ''
        type: string
      players_config_name:
        description: 'Bezeichnung der Mannschaft (für players_only)'
        required: false
        default: ''
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Playwright + Chromium installieren
        run: npx playwright install chromium --with-deps

      - name: BTV Daten holen
        if: ${{ inputs.players_only != 'true' }}
        run: node scripts/fetch-btv.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TZ: Europe/Berlin
          TEAMS_ONLY: ${{ inputs.teams_only || (github.event.schedule == '0 2 * * *' && 'true' || 'false') }}

      - name: Spieler-Meldelisten laden
        if: ${{ inputs.players_only == 'true' }}
        run: node scripts/fetch-players.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PLAYERS_GROUP_ID: ${{ inputs.players_group_id }}
          PLAYERS_TEAM_NAME: ${{ inputs.players_team_name }}
          PLAYERS_CONFIG_NAME: ${{ inputs.players_config_name }}
