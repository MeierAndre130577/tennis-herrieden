name: BTV Spielplan (nächtlich)

on:
  # 03:00 / 05:00 / 07:00 MESZ (Sommer) – bei Fehler greift automatisch der nächste Lauf
  # Läuft nur wirklich durch wenn heute noch kein erfolgreicher Lauf existiert
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 3 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  spielplan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Playwright + Chromium installieren
        run: npx playwright install chromium --with-deps

      - name: BTV Spielplan laden
        run: node scripts/fetch-btv.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TZ: Europe/Berlin
          TEAMS_ONLY: 'true'
