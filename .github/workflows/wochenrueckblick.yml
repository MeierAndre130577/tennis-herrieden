name: Wochenrückblick erstellen

on:
  # Jeden Dienstag 06:00 UTC (08:00 MESZ)
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

jobs:
  rueckblick:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Wochenrückblick erstellen
        run: node scripts/create-wochenrueckblick.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
