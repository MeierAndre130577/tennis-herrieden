<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tennis Herrieden – Display</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0F172A;
      --bg2:    #1E293B;
      --fg:     #F8FAFC;
      --green:  #22C55E;
      --blue:   #3B82F6;
      --red:    #EF4444;
      --amber:  #F59E0B;
      --slate:  #94A3B8;
      --border: #1E293B;
      --slot-free-bg:   #161F2E;
      --slot-free-fg:   #334155;
      --slot-free-bd:   #1E293B;
      --slot-reg-bg:    #22C55E22;
      --slot-reg-bd:    #22C55E66;
      --slot-reg-fg:    #4ADE80;
      --slot-guest-bg:  #16A34A22;
      --slot-guest-bd:  #16A34A66;
      --slot-guest-fg:  #4ADE80;
      --slot-train-bg:  #3B82F622;
      --slot-train-bd:  #3B82F666;
      --slot-train-fg:  #93C5FD;
      --slot-match-bg:  #EF444422;
      --slot-match-bd:  #EF444466;
      --slot-match-fg:  #FCA5A5;
      --slot-past-bg:   #0F172A;
      --slot-past-fg:   #1E293B;
    }

    /* ── HELL-THEME ── */
    body.theme-light {
      --bg:     #F8FAFC;
      --bg2:    #E2E8F0;
      --fg:     #0F172A;
      --green:  #16A34A;
      --blue:   #2563EB;
      --red:    #DC2626;
      --slate:  #475569;
      --border: #CBD5E1;
      --slot-free-bg:   #F1F5F9;
      --slot-free-fg:   #94A3B8;
      --slot-free-bd:   #CBD5E1;
      --slot-reg-bg:    #DCFCE7;
      --slot-reg-bd:    #86EFAC;
      --slot-reg-fg:    #166534;
      --slot-guest-bg:  #D1FAE5;
      --slot-guest-bd:  #6EE7B7;
      --slot-guest-fg:  #065F46;
      --slot-train-bg:  #DBEAFE;
      --slot-train-bd:  #93C5FD;
      --slot-train-fg:  #1E40AF;
      --slot-match-bg:  #FEE2E2;
      --slot-match-bd:  #FCA5A5;
      --slot-match-fg:  #991B1B;
      --slot-past-bg:   #F8FAFC;
      --slot-past-fg:   #CBD5E1;
    }

    /* ── HOHER-KONTRAST-THEME ── */
    body.theme-contrast {
      --bg:     #FFFFFF;
      --bg2:    #E5E7EB;
      --fg:     #000000;
      --green:  #15803D;
      --blue:   #1D4ED8;
      --red:    #B91C1C;
      --slate:  #374151;
      --border: #9CA3AF;
      --slot-free-bg:   #F3F4F6;
      --slot-free-fg:   #6B7280;
      --slot-free-bd:   #9CA3AF;
      --slot-reg-bg:    #BBF7D0;
      --slot-reg-bd:    #16A34A;
      --slot-reg-fg:    #14532D;
      --slot-guest-bg:  #A7F3D0;
      --slot-guest-bd:  #059669;
      --slot-guest-fg:  #064E3B;
      --slot-train-bg:  #BFDBFE;
      --slot-train-bd:  #2563EB;
      --slot-train-fg:  #1E3A8A;
      --slot-match-bg:  #FECACA;
      --slot-match-bd:  #DC2626;
      --slot-match-fg:  #7F1D1D;
      --slot-past-bg:   #F9FAFB;
      --slot-past-fg:   #D1D5DB;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', system-ui, sans-serif;
      overflow: hidden;
    }

    /* ── WHITE SCREEN MODE ── */
    #white-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #fff;
    }

    /* ── LAYOUT ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px 28px 16px;
      gap: 16px;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-area svg { flex-shrink: 0; }

    .logo-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--fg);
    }

    .logo-sub {
      font-size: 13px;
      color: var(--slate);
      margin-top: 2px;
    }

    .header-right {
      text-align: right;
    }

    #date-display {
      font-size: 22px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: -0.3px;
    }

    #time-display {
      font-size: 42px;
      font-weight: 800;
      color: var(--fg);
      letter-spacing: -1px;
      line-height: 1;
      margin-top: 2px;
    }

    /* ── STATUS BAR ── */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--slate);
      flex-shrink: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── GRID WRAPPER ── */
    #grid-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── TABLE ── */
    .cal-table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .cal-table th {
      background: var(--bg2);
      padding: 10px 8px;
      text-align: center;
      font-weight: 800;
      border-bottom: 2px solid var(--bg);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .th-time {
      width: 68px;
      font-size: 12px;
      color: var(--slate);
    }

    .th-court {
      font-size: 15px;
      color: var(--fg);
      border-left: 3px solid transparent;
    }

    .th-court .surface {
      font-size: 11px;
      color: var(--slate);
      font-weight: 600;
      margin-top: 2px;
    }

    .cal-table td {
      border-top: 1px solid var(--border);
      padding: 0;
      vertical-align: middle;
    }

    .td-time {
      text-align: right;
      padding: 0 12px 0 0;
      font-size: 13px;
      color: var(--slate);
      font-weight: 600;
      white-space: nowrap;
    }

    .td-slot {
      padding: 3px 4px;
      border-left: 1px solid var(--border);
    }

    .slot-btn {
      width: 100%;
      height: 100%;
      min-height: 36px;
      border-radius: 6px;
      border: 1.5px solid transparent;
      background: var(--bg2);
      color: var(--slate);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding: 0 8px;
    }

    .slot-free {
      background: var(--slot-free-bg);
      color: var(--slot-free-fg);
      border-color: var(--slot-free-bd);
      font-size: 11px;
    }

    .slot-past {
      background: var(--slot-past-bg);
      color: var(--slot-past-fg);
      border-color: transparent;
    }

    .slot-regular  { background: var(--slot-reg-bg);   border-color: var(--slot-reg-bd);   color: var(--slot-reg-fg);   }
    .slot-guest    { background: var(--slot-guest-bg);  border-color: var(--slot-guest-bd);  color: var(--slot-guest-fg);  }
    .slot-training { background: var(--slot-train-bg);  border-color: var(--slot-train-bd);  color: var(--slot-train-fg);  }
    .slot-match    { background: var(--slot-match-bg);  border-color: var(--slot-match-bd);  color: var(--slot-match-fg);  }

    /* current-time row highlight */
    .row-current .td-time {
      color: var(--green);
      font-weight: 800;
    }

    /* ── LEGEND ── */
    #legend {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--slate);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ── LOADING ── */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      font-size: 16px;
      color: var(--slate);
      z-index: 100;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--bg2);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>Lade…</div>
</div>

<div id="white-screen"></div>
<div id="debug" style="position:fixed;bottom:8px;right:8px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;padding:6px 10px;border-radius:6px;z-index:9999;font-family:monospace;line-height:1.6"></div>

<div id="app" style="display:none">
  <header>
    <div class="logo-area">
      <svg width="44" height="44" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="15" stroke="#22C55E" stroke-width="2"/>
        <ellipse cx="16" cy="16" rx="5" ry="14" stroke="#22C55E" stroke-width="1.5"/>
        <line x1="1" y1="16" x2="31" y2="16" stroke="#22C55E" stroke-width="1.5"/>
      </svg>
      <div>
        <div class="logo-title">Tennis Herrieden</div>
        <div class="logo-sub">Tagesbelegungsplan</div>
      </div>
    </div>
    <div class="header-right">
      <div id="date-display">–</div>
      <div id="time-display">–:–</div>
    </div>
  </header>

  <div id="status-bar">
    <div class="dot"></div>
    <span id="status-text">Verbunden · wird automatisch aktualisiert</span>
  </div>

  <div id="grid-wrap">
    <table class="cal-table" id="cal-table">
      <thead id="cal-head"></thead>
      <tbody id="cal-body"></tbody>
    </table>
  </div>

  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--slot-reg-fg)"></div>Gebucht</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--slot-guest-fg)"></div>Mit Gastspieler</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--slot-train-fg)"></div>Training</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--slot-match-fg)"></div>Spieltag</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--slot-free-bg);border:1px solid var(--slot-free-bd)"></div>Frei</div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────
const SUPABASE_URL  = "https://mzagislctxshpgqzniqg.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16YWdpc2xjdHhzaHBncXpuaXFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MjExMjYsImV4cCI6MjA5NzM5NzEyNn0.217jpWia-5WGHKQ7A1Qr2xNcV2CMXaLl3GbhM9cUdGM";

const SLOTS = ["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00"];
const COURT_COLORS = ["#22C55E","#EF4444","#3B82F6","#F59E0B","#8B5CF6","#EC4899","#14B8A6","#F97316"];
const DE_DAYS  = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const DE_MONTH = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let courts   = [];
let bookings = [];

// ── HELPERS ───────────────────────────────────────────────────────────────
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function currentSlot() {
  const h = new Date().getHours();
  if (h < 8)  return "08:00";
  if (h >= 20) return null;
  return String(h).padStart(2, "0") + ":00";
}

function isPast(slot) {
  const h = new Date().getHours();
  const slotH = parseInt(slot.split(":")[0]);
  return slotH < h;
}

// ── CLOCK ─────────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const day = DE_DAYS[now.getDay()];
  const date = now.getDate();
  const month = DE_MONTH[now.getMonth()];
  const year = now.getFullYear();
  document.getElementById("date-display").textContent = `${day}, ${date}. ${month} ${year}`;
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  document.getElementById("time-display").textContent = `${hh}:${mm}`;
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
  const today = todayStr();
  const cur   = currentSlot();

  const head = document.getElementById("cal-head");
  let headHtml = `<tr><th class="th-time"></th>`;
  courts.forEach((c, i) => {
    const color = COURT_COLORS[i % COURT_COLORS.length];
    headHtml += `<th class="th-court" style="border-left-color:${color}">
      ${c.name}
      <div class="surface">${c.surface}</div>
    </th>`;
  });
  headHtml += `</tr>`;
  head.innerHTML = headHtml;

  const body = document.getElementById("cal-body");
  let bodyHtml = "";

  SLOTS.forEach(slot => {
    const isCur  = slot === cur;
    const past   = isPast(slot);
    const rowCls = isCur ? " row-current" : "";

    bodyHtml += `<tr class="${rowCls}">`;
    bodyHtml += `<td class="td-time">${slot}</td>`;

    courts.forEach(court => {
      const booking = bookings.find(b =>
        b.court_id === court.id && b.date === today && b.slot === slot
      );

      let cellHtml = "";
      if (booking) {
        const type = booking.type || "regular";
        const withGuest = booking.with_guest;
        let cls = "slot-regular";
        let icon = "";
        let label = booking.user_name?.split(" ")[0] || "–";

        if (type === "training") { cls = "slot-training"; icon = "🏋️"; label = booking.label || "Training"; }
        else if (type === "match") { cls = "slot-match"; icon = "🏆"; label = booking.label || "Spieltag"; }
        else if (withGuest)       { cls = "slot-guest";  icon = "👥"; }

        cellHtml = `<div class="slot-btn ${cls}">${icon ? `<span>${icon}</span>` : ""}<span>${label}</span></div>`;
      } else if (past) {
        cellHtml = `<div class="slot-btn slot-past">—</div>`;
      } else {
        cellHtml = `<div class="slot-btn slot-free">Frei</div>`;
      }

      bodyHtml += `<td class="td-slot">${cellHtml}</td>`;
    });

    bodyHtml += `</tr>`;
  });

  body.innerHTML = bodyHtml;

  if (cur) {
    const rows = body.querySelectorAll("tr");
    const idx  = SLOTS.indexOf(cur);
    if (idx >= 0 && rows[idx]) {
      rows[idx].scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }
}

// ── LOAD DATA ─────────────────────────────────────────────────────────────
async function loadData() {
  const today = todayStr();

  const [courtsRes, bookingsRes] = await Promise.all([
    sb.from("courts").select("*").order("sort_order"),
    sb.from("bookings").select("*").eq("date", today).order("slot"),
  ]);

  courts   = courtsRes.data  || [];
  bookings = bookingsRes.data || [];

  document.getElementById("status-text").textContent =
    `Zuletzt aktualisiert: ${new Date().toLocaleTimeString("de-DE")} · wird automatisch aktualisiert`;

  render();
}

// ── REALTIME ──────────────────────────────────────────────────────────────
function subscribeRealtime() {
  sb.channel("display-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "bookings" }, () => {
      loadData();
    })
    .subscribe();
}

// ── DEBUG ─────────────────────────────────────────────────────────────────
function dbg(mode, theme, rows) {
  const el = document.getElementById("debug");
  if (el) el.innerHTML = `mode: <b>${mode}</b> | theme: <b>${theme}</b> | rows: ${rows} | ${new Date().toLocaleTimeString("de-DE")}`;
}

// ── SETTINGS POLLING ──────────────────────────────────────────────────────
function startSettingsPolling(mode, theme) {
  setInterval(async () => {
    const { data, error } = await sb.from("settings").select("*").in("key", ["display_mode", "display_theme"]);
    const rows = data ? data.length : `ERR:${error?.message}`;
    const s = Object.fromEntries((data || []).map(r => [r.key, r.value]));
    const newMode  = s.display_mode  || "schedule";
    const newTheme = s.display_theme || "dark";
    dbg(newMode, newTheme, rows);
    if (newMode !== mode || newTheme !== theme) {
      location.reload();
    }
  }, 10_000);
}

// ── MIDNIGHT RELOAD ───────────────────────────────────────────────────────
function scheduleMidnightReload() {
  const now  = new Date();
  const next = new Date(now);
  next.setHours(24, 0, 5, 0);
  const msUntil = next - now;
  setTimeout(() => location.reload(), msUntil);
}

// ── INIT ──────────────────────────────────────────────────────────────────
(async function init() {
  const { data: settingsData } = await sb.from("settings").select("*").in("key", ["display_mode", "display_theme"]);
  const settings = Object.fromEntries((settingsData || []).map(r => [r.key, r.value]));
  const displayMode  = settings.display_mode  || "schedule";
  const displayTheme = settings.display_theme || "dark";

  document.getElementById("loading").style.display = "none";

  if (displayMode === "white") {
    document.getElementById("white-screen").style.display = "block";
    startSettingsPolling(displayMode, displayTheme);
    return;
  }

  if (displayTheme === "light")    document.body.classList.add("theme-light");
  if (displayTheme === "contrast") document.body.classList.add("theme-contrast");

  updateClock();
  setInterval(updateClock, 30_000);

  await loadData();
  setInterval(loadData, 60_000);

  subscribeRealtime();
  startSettingsPolling(displayMode, displayTheme);
  scheduleMidnightReload();

  document.getElementById("app").style.display = "flex";
})();
</script>
</body>
</html>
