<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Spielzettel – Vereinsmeisterschaft</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      color: #111;
      background: #f4f4f2;
      padding: 24px 16px 60px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .sheet {
      max-width: 780px;
      margin: 0 auto;
      background: #fff;
      padding: 26px 30px 34px;
      box-shadow: 0 2px 14px rgba(0,0,0,.12);
    }

    .toolbar {
      max-width: 780px;
      margin: 0 auto 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar button {
      font-family: inherit;
      font-size: .875rem;
      font-weight: 700;
      padding: 10px 18px;
      border: none;
      border-radius: 9px;
      background: #8B5CF6;
      color: #fff;
      cursor: pointer;
    }
    .toolbar span { font-size: .8125rem; color: #555; }

    header.head {
      display: grid;
      grid-template-columns: 1fr 92px;
      gap: 18px;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 3px solid #111;
    }
    header.head h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.5px; line-height: 1.15; }
    header.head p  { margin-top: 5px; font-size: .78125rem; line-height: 1.5; color: #333; }
    header.head .url { font-weight: 700; }
    .headqr { text-align: center; }
    .headqr svg { width: 92px; height: 92px; display: block; }
    .headqr small { display: block; font-size: .6875rem; margin-top: 3px; color: #444; }
    .qr .fallback {
      width: 92px; height: 92px; border: 2px dashed #999; border-radius: 6px;
      display: flex; align-items: center; justify-content: center; font-size: .6875rem; color: #777;
    }

    .group { page-break-inside: avoid; break-inside: avoid; }

    h2.grp {
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      margin: 16px 0 3px;
      padding: 6px 10px;
      background: #111;
      color: #fff;
      border-radius: 5px;
    }
    .roster { font-size: .78125rem; color: #444; margin-bottom: 4px; }

    .row {
      display: grid;
      grid-template-columns: 92px 1fr 58px 58px 58px;
      gap: 8px;
      align-items: center;
    }
    .colhead {
      font-size: .625rem;
      font-weight: 700;
      letter-spacing: .6px;
      color: #666;
      text-transform: uppercase;
      padding-bottom: 3px;
      border-bottom: 1px solid #bbb;
    }
    .colhead > div:nth-child(n+3) { text-align: center; }

    .match {
      padding: 6px 0;
      border-bottom: 1px solid #d8d8d8;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .code {
      font-size: 1.1875rem;
      font-weight: 800;
      letter-spacing: 3px;
      font-variant-numeric: tabular-nums;
    }
    .players { font-size: .9375rem; font-weight: 700; line-height: 1.25; }
    .players em { font-style: normal; font-weight: 400; color: #555; }

    .box {
      height: 32px;
      border: 2px solid #111;
      border-radius: 5px;
    }

    .note {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 2px solid #111;
      font-size: .71875rem;
      line-height: 1.55;
      color: #333;
    }
    .msg { padding: 40px 0; text-align: center; font-size: 1rem; color: #555; }

    @media print {
      body { background: #fff; padding: 0; }
      .toolbar { display: none; }
      .sheet { box-shadow: none; max-width: none; padding: 0; }
      @page { size: A4 portrait; margin: 13mm; }
    }
  </style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">Drucken / als PDF speichern</button>
  <span>Im Druckdialog „Hintergrundgrafiken" aktivieren, dann sind die Gruppenbalken schwarz.</span>
</div>

<div class="sheet" id="sheet">
  <div class="msg">Lade Spielplan …</div>
</div>

<script>
const SUPABASE_URL  = "https://mzagislctxshpgqzniqg.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16YWdpc2xjdHhzaHBncXpuaXFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MjExMjYsImV4cCI6MjA5NzM5NzEyNn0.217jpWia-5WGHKQ7A1Qr2xNcV2CMXaLl3GbhM9cUdGM";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
});

const BASE = location.origin + "/ergebnis.html";

function qrSvg(text, cell) {
  if (typeof qrcode !== "function") return null;
  try {
    const q = qrcode(0, "M");
    q.addData(text);
    q.make();
    return q.createSvgTag({ cellSize: cell || 3, margin: 1, scalable: true });
  } catch (_) { return null; }
}

function el(parent, tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e);
  return e;
}

function qrInto(parent, url) {
  const box = el(parent, "div", "qr");
  const svg = qrSvg(url);
  if (svg) box.innerHTML = svg;
  else el(box, "div", "fallback", "QR n. verfügbar");
  return box;
}

function render(turnier, matches) {
  const sheet = document.getElementById("sheet");
  sheet.replaceChildren();

  const gruppen = Array.isArray(turnier.gruppen) ? turnier.gruppen : [];
  const nameById = {};
  gruppen.forEach(g => (g.spieler || []).forEach(p => { nameById[p.id] = p.name; }));

  const head = el(sheet, "header", "head");
  const left = el(head, "div");
  el(left, "h1", null, String(turnier.name || "Vereinsmeisterschaft"));
  const p = el(left, "p");
  p.appendChild(document.createTextNode("Ergebnis eintragen: QR-Code scannen oder "));
  el(p, "span", "url", BASE.replace(/^https?:\/\//, ""));
  p.appendChild(document.createTextNode(" öffnen, dann den Spielcode aus der ersten Spalte eingeben. Zwei Gewinnsätze, dritter Satz ist ein Match-Tiebreak bis 10."));

  const hq = el(head, "div", "headqr");
  qrInto(hq, BASE);
  el(hq, "small", null, "Eingabeseite");

  gruppen.forEach((g, gi) => {
    const players = (g.spieler || []).filter(s => s && s.id && String(s.name || "").trim());
    const sec = el(sheet, "section", "group");
    el(sec, "h2", "grp", String(g.name || "Gruppe " + (gi + 1)).toUpperCase());
    el(sec, "div", "roster", players.map(s => s.name).join("  ·  ") || "Keine Spieler eingetragen");

    const list = matches.filter(m => Number(m.gruppe) === gi)
      .sort((a, b) => (nameById[a.p1] || "").localeCompare(nameById[b.p1] || "", "de"));

    if (!list.length) { el(sec, "div", "roster", "Noch keine Paarungen erzeugt."); return; }

    const head = el(sec, "div", "row colhead");
    ["Code", "Paarung", "1. Satz", "2. Satz", "Tiebreak"].forEach(t => el(head, "div", null, t));

    list.forEach(m => {
      const row = el(sec, "div", "row match");
      el(row, "div", "code", m.code);

      const pl = el(row, "div", "players");
      pl.appendChild(document.createTextNode(nameById[m.p1] || "?"));
      el(pl, "em", null, "  gegen  ");
      pl.appendChild(document.createTextNode(nameById[m.p2] || "?"));

      el(row, "div", "box");
      el(row, "div", "box");
      el(row, "div", "box");
    });
  });

  el(sheet, "div", "note",
    "Die Kästchen sind zum Mitschreiben – gültig ist, was auf der Seite eingetragen wird. " +
    "Ein Ergebnis lässt sich jederzeit mit demselben Code korrigieren.");
}

(async function () {
  const sheet = document.getElementById("sheet");
  let tid = new URLSearchParams(location.search).get("t");
  if (!tid) {
    const { data } = await sb.from("settings").select("value")
      .eq("key", "display_vm_turnier").maybeSingle();
    tid = String(data?.value || "").trim();
  }
  if (!tid) { sheet.innerHTML = '<div class="msg">Kein Turnier ausgewählt.</div>'; return; }

  const { data: t } = await sb.from("vm_turniere").select("id,name,gruppen").eq("id", tid).maybeSingle();
  if (!t) { sheet.innerHTML = '<div class="msg">Turnier nicht gefunden.</div>'; return; }

  const { data: ms } = await sb.from("vm_matches").select("code,gruppe,p1,p2").eq("turnier_id", tid);
  render(t, ms || []);
})();
</script>
</body>
</html>
