<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tennis Herrieden – Display</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0F172A;
      --bg2:    #1E293B;
      --fg:     #F8FAFC;
      --green:  #22C55E;
      --blue:   #3B82F6;
      --red:    #EF4444;
      --amber:  #F59E0B;
      --slate:  #94A3B8;
      --border: #1E293B;
      --slot-free-bg:   #161F2E;
      --slot-free-fg:   #334155;
      --slot-free-bd:   #1E293B;
      --slot-reg-bg:    #22C55E22;
      --slot-reg-bd:    #22C55E66;
      --slot-reg-fg:    #4ADE80;
      --slot-guest-bg:  #16A34A22;
      --slot-guest-bd:  #16A34A66;
      --slot-guest-fg:  #4ADE80;
      --slot-train-bg:  #3B82F622;
      --slot-train-bd:  #3B82F666;
      --slot-train-fg:  #93C5FD;
      --slot-match-bg:  #EF444422;
      --slot-match-bd:  #EF444466;
      --slot-match-fg:  #FCA5A5;
      --slot-past-bg:   #0F172A;
      --slot-past-fg:   #1E293B;
    }

    /* ── HELL-THEME ── */
    body.theme-light {
      --bg:     #F8FAFC;
      --bg2:    #E2E8F0;
      --fg:     #0F172A;
      --green:  #16A34A;
      --blue:   #2563EB;
      --red:    #DC2626;
      --slate:  #475569;
      --border: #CBD5E1;
      --slot-free-bg:   #F1F5F9;
      --slot-free-fg:   #94A3B8;
      --slot-free-bd:   #CBD5E1;
      --slot-reg-bg:    #DCFCE7;
      --slot-reg-bd:    #86EFAC;
      --slot-reg-fg:    #166534;
      --slot-guest-bg:  #D1FAE5;
      --slot-guest-bd:  #6EE7B7;
      --slot-guest-fg:  #065F46;
      --slot-train-bg:  #DBEAFE;
      --slot-train-bd:  #93C5FD;
      --slot-train-fg:  #1E40AF;
      --slot-match-bg:  #FEE2E2;
      --slot-match-bd:  #FCA5A5;
      --slot-match-fg:  #991B1B;
      --slot-past-bg:   #F8FAFC;
      --slot-past-fg:   #CBD5E1;
    }

    /* ── HOHER-KONTRAST-THEME ── */
    body.theme-contrast {
      --bg:     #FFFFFF;
      --bg2:    #E5E7EB;
      --fg:     #000000;
      --green:  #15803D;
      --blue:   #1D4ED8;
      --red:    #B91C1C;
      --slate:  #374151;
      --border: #9CA3AF;
      --slot-free-bg:   #F3F4F6;
      --slot-free-fg:   #6B7280;
      --slot-free-bd:   #9CA3AF;
      --slot-reg-bg:    #BBF7D0;
      --slot-reg-bd:    #16A34A;
      --slot-reg-fg:    #14532D;
      --slot-guest-bg:  #A7F3D0;
      --slot-guest-bd:  #059669;
      --slot-guest-fg:  #064E3B;
      --slot-train-bg:  #BFDBFE;
      --slot-train-bd:  #2563EB;
      --slot-train-fg:  #1E3A8A;
      --slot-match-bg:  #FECACA;
      --slot-match-bd:  #DC2626;
      --slot-match-fg:  #7F1D1D;
      --slot-past-bg:   #F9FAFB;
      --slot-past-fg:   #D1D5DB;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', system-ui, sans-serif;
      overflow: hidden;
    }

    /* ── FOTOS MODE ── */
    #fotos-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }
    #fotos-slides {
      position: absolute;
      inset: 0;
    }
    #fotos-slides img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    #fotos-slides img.active {
      opacity: 1;
    }
    #fotos-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 32px;
      background: linear-gradient(transparent, rgba(0,0,0,0.65));
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    #fotos-title {
      font-size: clamp(16px, 2vw, 28px);
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,.6);
      flex: 1;
    }
    #fotos-dots {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }
    .fotos-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      transition: background 0.3s;
    }
    .fotos-dot.active {
      background: #fff;
    }
    #fotos-empty {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      font-size: clamp(18px, 2.5vw, 36px);
      color: rgba(255,255,255,0.4);
    }

    /* ── WHITE SCREEN MODE ── */
    #white-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #fff;
    }

    /* ── BILD MODE ── */
    #bild-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    #bild-screen header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px;
      flex-shrink: 0;
      background: var(--bg);
    }
    #bild-img-wrap {
      flex: 1;
      overflow: hidden;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #bild-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    /* ── HEIMSPIEL MODE ── */
    #heimspiel-app {
      display: none;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      padding: 2vh 2.5vw 1.5vh;
      gap: 1.5vh;
    }

    /* Zusätzliche CSS-Vars für Heimspiel-Farben */
    :root {
      --win-bg:        #14532D; --win-fg:  #4ADE80;
      --loss-bg:       #450A0A; --loss-fg: #FCA5A5;
      --live-bg:       #78350F; --live-fg: #FCD34D;
      --bg3:           #334155;
      --bg-double:        #243044;
      --border-double:    #3B82F6;
    }
    body.theme-light {
      --win-bg:           #DCFCE7; --win-fg:  #166534;
      --loss-bg:          #FEE2E2; --loss-fg: #991B1B;
      --live-bg:          #FEF3C7; --live-fg: #92400E;
      --bg3:              #E2E8F0;
      --bg-double:        #D1DCF0;
      --border-double:    #2563EB;
    }
    body.theme-contrast {
      --win-bg:           #052E16; --win-fg:  #86EFAC;
      --loss-bg:          #450A0A; --loss-fg: #FCA5A5;
      --live-bg:          #451A03; --live-fg: #FDE68A;
      --bg3:              #1A1A1A;
      --bg-double:        #1E293B; /* wie bg2, Unterschied nur über Border */
      --border-double:    #60A5FA; /* helles Blau für Kontrast-Theme */
    }

    /* Header */
    #hs-header { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .hs-header-left { display:flex; flex-direction:column; gap:2px; }
    .hs-league { font-size:clamp(11px,1.1vw,16px); font-weight:700; color:var(--slate); text-transform:uppercase; letter-spacing:.8px; }
    .hs-team   { font-size:clamp(18px,2vw,30px);   font-weight:800; color:var(--fg); }

    /* Scoreboard */
    .hs-scoreboard { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:2vw; flex-shrink:0; }
    .hs-team-block { display:flex; flex-direction:column; gap:4px; }
    .hs-team-home  { text-align:right; align-items:flex-end; }
    .hs-team-away  { text-align:left;  align-items:flex-start; }
    .hs-team-label { font-size:clamp(10px,.9vw,14px); font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--slate); }
    .hs-team-row   { display:flex; align-items:center; gap:clamp(8px,1vw,16px); }
    .hs-team-home .hs-team-row { flex-direction:row-reverse; }
    .hs-team-name  { font-size:clamp(20px,3vw,46px); font-weight:800; line-height:1.1; color:var(--fg); }
    .hs-team-away .hs-team-name { color:var(--slate); }
    .hs-logo { height:clamp(44px,5.5vw,88px); width:clamp(44px,5.5vw,88px); object-fit:contain; flex-shrink:0; }
    .hs-score-center { display:flex; flex-direction:column; align-items:center; gap:8px; min-width:12vw; }
    .hs-score-big { font-size:clamp(60px,10vw,130px); font-weight:800; letter-spacing:-4px; line-height:1; }
    .hs-score-done     { color:var(--win-fg); }
    .hs-score-live     { color:var(--live-fg); }
    .hs-score-upcoming { color:var(--slate); }
    .hs-badge { font-size:clamp(10px,.9vw,13px); font-weight:800; padding:4px 14px; border-radius:20px; letter-spacing:.7px; text-transform:uppercase; white-space:nowrap; }
    .hs-badge-done     { background:var(--win-bg);  color:var(--win-fg); }
    .hs-badge-live     { background:var(--live-bg); color:var(--live-fg); animation:livepulse 1.5s ease-in-out infinite; }
    .hs-badge-upcoming { background:var(--bg2);     color:var(--slate); border:1px solid var(--border); }
    @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* Rubbers */
    .hs-rubbers { flex:1; display:flex; flex-direction:column; gap:.6vh; min-height:0; overflow:hidden; }
    .hs-rubbers-label { font-size:clamp(10px,.9vw,13px); font-weight:700; color:var(--slate); text-transform:uppercase; letter-spacing:.8px; text-align:center; border-top:1px solid var(--border); padding-top:.6vh; flex-shrink:0; }
    /* Grid: Spaltenanzahl wird per JS gesetzt (2 für ≤6 Rubbers, 3 für 9) */
    .hs-rubbers-grid { flex:1; display:grid; gap:clamp(4px,.5vw,8px); min-height:0; overflow:hidden; }
    .hs-rubber { background:var(--bg2); border-radius:clamp(4px,.5vw,10px); padding:clamp(6px,.7vh,12px) clamp(8px,.8vw,14px); display:flex; align-items:center; gap:clamp(4px,.5vw,9px); min-width:0; overflow:hidden; }
    .hs-rubber--double { background:var(--bg-double); border-left:3px solid var(--border-double); }
    .hs-rubber-num { font-size:clamp(13px,1.4vw,22px); font-weight:800; color:var(--slate); min-width:clamp(26px,2.6vw,42px); text-transform:uppercase; flex-shrink:0; line-height:1; }
    .hs-rubber-players { flex:1; min-width:0; }
    .hs-rubber-home { font-size:clamp(14px,1.5vw,24px); font-weight:700; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.2; }
    .hs-rubber-away { font-size:clamp(11px,1.15vw,18px); color:var(--slate); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; opacity:.8; line-height:1.2; }
    .hs-meld-pos { font-size:.65em; font-weight:600; opacity:.6; margin-right:.25em; vertical-align:.05em; }
    .hs-rubber-score { font-size:clamp(14px,1.5vw,24px); font-weight:800; white-space:nowrap; color:var(--fg); flex-shrink:0; }
    .hs-rubber-score.live { color:var(--live-fg); }
    .hs-rubber-result { width:clamp(26px,2.6vw,42px); height:clamp(26px,2.6vw,42px); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:clamp(12px,1.3vw,20px); font-weight:800; flex-shrink:0; }
    @keyframes hs-spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .hs-spin-ball { animation:hs-spin 1s linear infinite; display:block; }
    .hs-result-win  { background:var(--win-bg);  color:var(--win-fg); }
    .hs-result-loss { background:var(--loss-bg); color:var(--loss-fg); }
    .hs-result-live { background:var(--live-bg); color:var(--live-fg); }
    .hs-result-open { background:var(--bg2); color:var(--border); border:1px solid var(--border); }

    /* Upcoming box */
    .hs-upcoming { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5vh; background:var(--bg2); border-radius:clamp(8px,1vw,16px); text-align:center; }
    .hs-upcoming-time { font-size:clamp(48px,8vw,110px); font-weight:800; color:var(--slate); letter-spacing:-2px; line-height:1; }
    .hs-upcoming-hint { font-size:clamp(13px,1.3vw,20px); color:var(--slate); font-weight:600; }

    /* Loading state within heimspiel */
    .hs-loading { flex:1; display:flex; align-items:center; justify-content:center; color:var(--slate); font-size:clamp(14px,1.4vw,20px); gap:12px; }

    /* ── LAYOUT ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px 28px 16px;
      gap: 16px;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-area svg { flex-shrink: 0; }

    .logo-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--fg);
    }

    .logo-sub {
      font-size: 13px;
      color: var(--slate);
      margin-top: 2px;
    }

    .header-right {
      text-align: right;
    }

    #date-display {
      font-size: 22px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: -0.3px;
    }

    #time-display {
      font-size: 42px;
      font-weight: 800;
      color: var(--fg);
      letter-spacing: -1px;
      line-height: 1;
      margin-top: 2px;
    }

    /* ── STATUS BAR ── */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--slate);
      flex-shrink: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── GRID WRAPPER ── */
    #grid-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── TABLE ── */
    .cal-table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .cal-table th {
      background: var(--bg2);
      padding: 10px 8px;
      text-align: center;
      font-weight: 800;
      border-bottom: 2px solid var(--bg);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .th-time {
      width: 68px;
      font-size: 12px;
      color: var(--slate);
    }

    .th-court {
      font-size: 15px;
      color: var(--fg);
      border-left: 3px solid transparent;
    }

    .th-court .surface {
      font-size: 11px;
      color: var(--slate);
      font-weight: 600;
      margin-top: 2px;
    }

    .cal-table td {
      border-top: 1px solid var(--border);
      padding: 0;
      vertical-align: middle;
    }

    .td-time {
      text-align: right;
      padding: 0 12px 0 0;
      font-size: 13px;
      color: var(--slate);
      font-weight: 600;
      white-space: nowrap;
    }

    .td-slot {
      padding: 3px 4px;
      border-left: 1px solid var(--border);
    }

    .slot-btn {
      width: 100%;
      height: 100%;
      min-height: 36px;
      border-radius: 6px;
      border: 1.5px solid transparent;
      background: var(--bg2);
      color: var(--slate);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding: 0 8px;
    }

    .slot-free {
      background: var(--slot-free-bg);
      color: var(--slot-free-fg);
      border-color: var(--slot-free-bd);
      font-size: 11px;
    }

    .slot-past {
      background: var(--slot-past-bg);
      color: var(--slot-past-fg);
      border-color: transparent;
    }

    .slot-regular  { background: var(--slot-reg-bg);   border-color: var(--slot-reg-bd);   color: var(--slot-reg-fg);   }
    .slot-guest    { background: var(--slot-guest-bg);  border-color: var(--slot-guest-bd);  color: var(--slot-guest-fg);  }
    .slot-training { background: var(--slot-train-bg);  border-color: var(--slot-train-bd);  color: var(--slot-train-fg);  }
    .slot-match    { background: var(--slot-match-bg);  border-color: var(--slot-match-bd);  color: var(--slot-match-fg);  }

    /* current-time row highlight */
    .row-current .td-time {
      color: var(--green);
      font-weight: 800;
    }

    /* ── LEGEND ── */
    #legend {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--slate);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ── LOADING ── */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      font-size: 16px;
      color: var(--slate);
      z-index: 100;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--bg2);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>Lade…</div>
</div>

<div id="white-screen"></div>

<!-- ── FOTOS MODE ── -->
<div id="fotos-screen">
  <div id="fotos-slides"></div>
  <div id="fotos-caption">
    <span id="fotos-title"></span>
    <span id="fotos-dots"></span>
  </div>
  <div id="fotos-empty">📷 Keine Fotos diese Woche</div>
</div>

<!-- ── BILD MODE ── -->
<div id="bild-screen">
  <header>
    <div class="logo-area">
      <svg width="44" height="44" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="15" stroke="#22C55E" stroke-width="2"/>
        <ellipse cx="16" cy="16" rx="5" ry="14" stroke="#22C55E" stroke-width="1.5"/>
        <line x1="1" y1="16" x2="31" y2="16" stroke="#22C55E" stroke-width="1.5"/>
      </svg>
      <div>
        <div class="logo-title">Tennis Herrieden</div>
        <div class="logo-sub">Bildanzeige</div>
      </div>
    </div>
    <div class="header-right">
      <div id="bild-date" style="font-size:22px;font-weight:800;color:var(--green);letter-spacing:-0.3px;">–</div>
      <div id="bild-time" style="font-size:42px;font-weight:800;color:var(--fg);letter-spacing:-1px;line-height:1;margin-top:2px;">–:–</div>
    </div>
  </header>
  <div id="bild-img-wrap">
    <img id="bild-img" alt=""/>
  </div>
</div>

<!-- ── HEIMSPIEL ── -->
<div id="heimspiel-app">
  <header id="hs-header">
    <div class="hs-header-left">
      <div class="hs-league" id="hs-league">–</div>
      <div class="hs-team"   id="hs-team">–</div>
    </div>
    <div class="header-right">
      <div id="hs-date">–</div>
      <div id="hs-time">–:–</div>
    </div>
  </header>
  <main id="hs-main" style="display:flex;flex-direction:column;justify-content:flex-start;gap:1.5vh;min-height:0;flex:1">
    <div class="hs-loading"><div class="spinner"></div><span>Lade Spielstand…</span></div>
  </main>
  <footer style="display:flex;align-items:center;justify-content:space-between;font-size:clamp(10px,.9vw,13px);color:var(--slate)">
    <div style="display:flex;align-items:center;gap:6px"><div class="dot"></div><span id="hs-status">Verbunden</span></div>
    <span>Tennis Herrieden · Heimspielmodus</span>
  </footer>
</div>

<div id="app" style="display:none">
  <header>
    <div class="logo-area">
      <svg width="44" height="44" viewBox="0 0 32 32" fill="none">

    _wakeLock = await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener('release', () => { _wakeLock = null; });

const SUPABASE_URL  = "https://irszeiamvwyrntyauury.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlyc3plaWFtdnd5cm50eWF1dXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2Mzc1MjcsImV4cCI6MjA5NjIxMzUyN30.ryxib1E5E2cfkwfXj6i2EnmD56tyCtz_39u7Bpw7qSc";

const SLOTS = ["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00"];
const COURT_COLORS = ["#22C55E","#EF4444","#3B82F6","#F59E0B","#8B5CF6","#EC4899","#14B8A6","#F97316"];
const DE_DAYS  = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const DE_MONTH = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let courts   = [];
let bookings = [];

// ── HELPERS ───────────────────────────────────────────────────────────────
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function currentSlot() {
  const h = new Date().getHours();
  if (h < 8)  return "08:00";
  if (h >= 20) return null;
  return String(h).padStart(2, "0") + ":00";
}

function isPast(slot) {
  const h = new Date().getHours();
  const slotH = parseInt(slot.split(":")[0]);
  return slotH < h;
}

// ── CLOCK ─────────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const day = DE_DAYS[now.getDay()];
  const date = now.getDate();
  const month = DE_MONTH[now.getMonth()];
  const year = now.getFullYear();
  document.getElementById("date-display").textContent = `${day}, ${date}. ${month} ${year}`;
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  document.getElementById("time-display").textContent = `${hh}:${mm}`;
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
  const today = todayStr();
  const cur   = currentSlot();

  const head = document.getElementById("cal-head");
  let headHtml = `<tr><th class="th-time"></th>`;
  courts.forEach((c, i) => {
    const color = COURT_COLORS[i % COURT_COLORS.length];
    headHtml += `<th class="th-court" style="border-left-color:${color}">
      ${c.name}
      <div class="surface">${c.surface}</div>
    </th>`;
  });
  headHtml += `</tr>`;
  head.innerHTML = headHtml;

  const body = document.getElementById("cal-body");
  let bodyHtml = "";

  SLOTS.forEach(slot => {
    const isCur  = slot === cur;
    const past   = isPast(slot);
    const rowCls = isCur ? " row-current" : "";

    bodyHtml += `<tr class="${rowCls}">`;
    bodyHtml += `<td class="td-time">${slot}</td>`;

    courts.forEach(court => {
      const booking = bookings.find(b =>
        b.court_id === court.id && b.date === today && b.slot === slot
      );

      let cellHtml = "";
      if (booking) {
        const type = booking.type || "regular";
        const withGuest = booking.with_guest;
        let cls = "slot-regular";
        let icon = "";
        let label = booking.user_name?.split(" ")[0] || "–";

        if (type === "training") { cls = "slot-training"; icon = "🏋️"; label = booking.label || "Training"; }
        else if (type === "match") { cls = "slot-match"; icon = "🏆"; label = booking.label || "Spieltag"; }
        else if (withGuest)       { cls = "slot-guest";  icon = "👥"; }

        cellHtml = `<div class="slot-btn ${cls}">${icon ? `<span>${icon}</span>` : ""}<span>${label}</span></div>`;
      } else if (past) {
        cellHtml = `<div class="slot-btn slot-past">—</div>`;
      } else {
        cellHtml = `<div class="slot-btn slot-free">Frei</div>`;
      }

      bodyHtml += `<td class="td-slot">${cellHtml}</td>`;
    });

    bodyHtml += `</tr>`;
  });

  body.innerHTML = bodyHtml;

  if (cur) {
    const rows = body.querySelectorAll("tr");
    const idx  = SLOTS.indexOf(cur);
    if (idx >= 0 && rows[idx]) {
      rows[idx].scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }
}

// ── SETTINGS POLLING ──────────────────────────────────────────────────────
function startSettingsPolling(mode, theme, vereinsnr, saison, mannschaft, gegner) {
  setInterval(async () => {
    const { data } = await sb.from("settings").select("*")
      .in("key", ["display_mode","display_theme","display_vereinsnummer","display_saison",
                  "display_mannschaft","display_gegner",
                  "display_sched_schedule","display_sched_heimspiel","display_sched_bild"]);
    const s = Object.fromEntries((data || []).map(r => [r.key, r.value]));
    const nowP = new Date();
    const ps = (key) => { try { return JSON.parse(s[key]||"{}"); } catch(_){ return {}; } };
    const sm = { schedule: ps("display_sched_schedule"), heimspiel: ps("display_sched_heimspiel"), bild: ps("display_sched_bild") };
    const sa = Object.entries(sm).find(([,sc]) => sc.from && sc.to && nowP >= new Date(sc.from) && nowP <= new Date(sc.to));
    const resolvedMode = sa ? sa[0] : (s.display_mode || "schedule");
    if (
      resolvedMode !== mode     ||
      (s.display_theme         || "dark")     !== theme    ||
      (s.display_vereinsnummer || "")         !== vereinsnr||
      (s.display_saison        || "")         !== saison   ||
      (s.display_mannschaft    || "")         !== mannschaft||
      (s.display_gegner        || "")         !== gegner
    ) {
      location.reload();
    }
  }, 10_000);
}

// ── HEIMSPIEL ─────────────────────────────────────────────────────────────
const RESULT_LABEL = { win:"W", loss:"N", open:"?" };
// Nachname + Vorname-Initial: "Schumann, Torsten / Bschorer, Leon" → "Schumann T. / Bschorer L."
function parseMeldPos(name) {
  const m = (name||"").match(/^\[(\d+)\]\s+(.+)$/);
  return m ? { pos: m[1], name: m[2] } : { pos: null, name: name||"–" };
}
function formatName(raw) {
  const { pos, name } = parseMeldPos(raw);
  const prefix = pos ? `<span class="hs-meld-pos">[${pos}]</span>` : "";
  return prefix + (name||"–");
}
function shortName(full) {
  return (full||"–").split(" / ").map(n => {
    const { pos, name } = parseMeldPos(n.trim());
    const [last, first] = name.split(",").map(s => s.trim());
    const short = first ? `${last} ${first[0]}.` : last;
    return (pos ? `<span class="hs-meld-pos">[${pos}]</span>` : "") + short;
  }).join(" / ");
}
const LIVE_BALL_SVG = `<svg class="hs-spin-ball" viewBox="0 0 32 32" fill="none" style="width:65%;height:65%"><circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="2.5"/><ellipse cx="16" cy="16" rx="5" ry="12" stroke="currentColor" stroke-width="2"/><line x1="3" y1="16" x2="29" y2="16" stroke="currentColor" stroke-width="2"/></svg>`;

function renderHsMatch(match) {
  const main = document.getElementById("hs-main");
  if (!match) {
    main.innerHTML = `<div class="hs-loading">Kein Heimspiel heute gefunden</div>`;
    return;
  }

  document.getElementById("hs-league").textContent = match.league || "–";
  document.getElementById("hs-team").textContent   = match.homeTeam || "Tennis Herrieden";

  const rubbers = match.rubbers || [];
  const status  = match.status; // "upcoming" | "live" | "done"

  // Nutze direkt homeScore/awayScore aus dem Cache wenn vorhanden,
  // sonst zählen aus Rubbers
  const wins   = match.homeScore != null ? match.homeScore : rubbers.filter(r => r.result === "win").length;
  const losses = match.awayScore != null ? match.awayScore : rubbers.filter(r => r.result === "loss").length;

  const scoreClass = { upcoming:"hs-score-upcoming", live:"hs-score-live", done:"hs-score-done" }[status] || "hs-score-upcoming";
  const badgeClass = { upcoming:"hs-badge-upcoming", live:"hs-badge-live",  done:"hs-badge-done"  }[status] || "hs-badge-upcoming";
  const badgeLabel = { upcoming:"Noch nicht begonnen", live:"● Läuft", done:"✓ Abgeschlossen" }[status] || "–";
  const scoreText  = status === "upcoming" ? "–:–" : `${wins}:${losses}`;

  let middleHtml = "";
  if (status === "upcoming") {
    const dateStr = match.matchDate
      ? new Date(match.matchDate + "T12:00:00").toLocaleDateString("de-DE",
          {weekday:"long", day:"numeric", month:"long"})
      : "";
    const timeStr = match.time || "";
    middleHtml = `
      <div class="hs-upcoming">
        ${dateStr ? `<div class="hs-upcoming-hint" style="font-size:clamp(15px,1.5vw,22px)">${dateStr}</div>` : ""}
        ${timeStr ? `<div class="hs-upcoming-time">${timeStr}</div>` : ""}
        <div class="hs-upcoming-hint">Aufstellung noch nicht eingetragen</div>
      </div>`;
  } else {
    // Rubbers sortieren: Einzel E1–E6, dann Doppel D1–D3
    const singles = rubbers.filter(r => r.id.startsWith("E")).sort((a,b) => a.id.localeCompare(b.id));
    const doubles = rubbers.filter(r => r.id.startsWith("D")).sort((a,b) => a.id.localeCompare(b.id));

    // Dynamisch: ≤4 Einzel → 2 Spalten (4er-Mannschaft), sonst 3 Spalten
    const cols = singles.length > 4 ? 3 : 2;

    // Column-Major-Anordnung innerhalb Einzel: E1 E3 E5 / E2 E4 E6
    // Formel: Zeile r, Spalte c → singles[c * numSingleRows + r]
    const numSingleRows = Math.ceil(singles.length / cols);
    const singleGrid = [];
    for (let r = 0; r < numSingleRows; r++) {
      for (let c = 0; c < cols; c++) {
        singleGrid.push(singles[c * numSingleRows + r] ?? null);
      }
    }

    // Doppel: sequentiell D1 D2 D3 (bei 1 Zeile = auch column-major)
    const numDoubleRows = Math.ceil(doubles.length / cols);
    const doubleGrid = [];
    for (let r = 0; r < numDoubleRows; r++) {
      for (let c = 0; c < cols; c++) {
        doubleGrid.push(doubles[c * numDoubleRows + r] ?? null);
      }
    }

    const allOrdered = [...singleGrid, ...doubleGrid];

    const rubberHtml = allOrdered.map(r => {
      if (!r) return `<div class="hs-rubber" style="visibility:hidden"></div>`;
      const isDouble = r.id.startsWith("D");
      return `
      <div class="hs-rubber${isDouble ? " hs-rubber--double" : ""}">
        <span class="hs-rubber-num">${r.id}</span>
        <div class="hs-rubber-players">
          <div class="hs-rubber-home">${isDouble ? shortName(r.home) : formatName(r.home)}</div>
          <div class="hs-rubber-away">${isDouble ? shortName(r.away) : formatName(r.away)}</div>
        </div>
        <span class="hs-rubber-score${r.result==="live"?" live":""}">${r.score}</span>
        <span class="hs-rubber-result hs-result-${r.result}">${r.result==="live"?LIVE_BALL_SVG:(RESULT_LABEL[r.result]||"?")}</span>
      </div>`;
    }).join("");

    middleHtml = `
      <div class="hs-rubbers">
        <div class="hs-rubbers-label">Einzel &amp; Doppel</div>
        <div class="hs-rubbers-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${rubberHtml}</div>
      </div>`;
  }

  main.innerHTML = `
    <div class="hs-scoreboard">
      <div class="hs-team-block hs-team-home">
        <div class="hs-team-label">Heim</div>
        <div class="hs-team-row">
          ${match.homeLogo ? `<img class="hs-logo" src="${match.homeLogo}" alt="" onerror="this.style.display='none'">` : ""}
          <div class="hs-team-name">${match.homeTeam || "Tennis Herrieden"}</div>
        </div>
      </div>
      <div class="hs-score-center">
        <div class="hs-score-big ${scoreClass}">${scoreText}</div>
        <span class="hs-badge ${badgeClass}">${badgeLabel}</span>
      </div>
      <div class="hs-team-block hs-team-away">
        <div class="hs-team-label">Gast</div>
        <div class="hs-team-row">
          ${match.awayLogo ? `<img class="hs-logo" src="${match.awayLogo}" alt="" onerror="this.style.display='none'">` : ""}
          <div class="hs-team-name">${match.awayTeam || "–"}</div>
        </div>
      </div>
    </div>
    ${middleHtml}`;
}

async function loadHsMatch() {
  try {
    const cacheRes = await sb.from("settings").select("value").eq("key","btv_match_cache").single();
    let match = null;
    if (cacheRes.data?.value) {
      match = typeof cacheRes.data.value === "string"
        ? JSON.parse(cacheRes.data.value) : cacheRes.data.value;
    }
    if (!match) match = {};

    const newJson = JSON.stringify(match);
    if (newJson !== _cachedMatchJson) {
      _cachedMatchJson = newJson;
      renderHsMatch(match);
    }
    document.getElementById("hs-status").textContent =
      `Zuletzt aktualisiert: ${new Date().toLocaleTimeString("de-DE")}`;
  } catch (err) {
    document.getElementById("hs-status").textContent = `Fehler: ${err.message}`;
  }
}

// ── FOTOS SLIDESHOW ───────────────────────────────────────────────────────
async function startFotosModus(intervalSec) {
  const screen = document.getElementById("fotos-screen");
  screen.style.display = "block";

  const slideInterval = Math.max(3, intervalSec || 8) * 1000;

  // Aktuelle Woche: Montag 00:00 bis Sonntag 23:59:59 (lokal)
  function weekRange() {
    const now = new Date();
    const dow = now.getDay() === 0 ? 6 : now.getDay() - 1;
    const monday = new Date(now);
    monday.setDate(now.getDate() - dow);
    monday.setHours(0, 0, 0, 0);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    sunday.setHours(23, 59, 59, 999);
    return { from: monday.toISOString(), to: sunday.toISOString() };
  }

  // Gleiche Filter wie Clubstream: status=published, deleted_at null, hat Bild
  async function loadPhotos() {
    const { from, to } = weekRange();
    console.log("[Fotos] Woche:", from, "→", to);

    const { data, error } = await sb.from("club_photos")
      .select("*")
      .gte("created_at", from)
      .lte("created_at", to)
      .order("created_at", { ascending: false });

    console.log("[Fotos] club_photos Ergebnis:", data?.length ?? 0, "Fehler:", error?.message ?? "keiner");
    if (data?.length) console.log("[Fotos] Felder erstes Objekt:", Object.keys(data[0]), data[0]);

    if (!data?.length) return [];

    // Bild-URL-Feld ermitteln: url / image_url / photo_url / src
    const urlField = ["url","image_url","photo_url","src","file_url"].find(f => data[0][f]);
    const titleField = ["caption","title","description","name"].find(f => data[0][f]);
    console.log("[Fotos] URL-Feld:", urlField, "Titel-Feld:", titleField);

    return data
      .map(r => ({ id: r.id, image_url: r[urlField] || "", title: r[titleField] || "" }))
      .filter(r => r.image_url);
  }

  let photos = await loadPhotos();
  let current = 0;
  let slideTimer = null;

  function buildSlides(list) {
    const slides = document.getElementById("fotos-slides");
    const dotsEl = document.getElementById("fotos-dots");
    slides.innerHTML = list.map((p, i) =>
      `<img src="${p.image_url}" data-id="${p.id}"
            data-title="${(p.title||"").replace(/"/g,"&quot;")}"
            class="${i === 0 ? "active" : ""}">`
    ).join("");
    dotsEl.innerHTML = list.map((_, i) =>
      `<span class="fotos-dot ${i === 0 ? "active" : ""}"></span>`
    ).join("");
  }

  function render(list) {
    const empty   = document.getElementById("fotos-empty");
    const caption = document.getElementById("fotos-caption");
    if (!list.length) {
      document.getElementById("fotos-slides").innerHTML = "";
      document.getElementById("fotos-dots").innerHTML = "";
      caption.style.display = "none";
      empty.style.display = "flex";
      return;
    }
    empty.style.display = "none";
    caption.style.display = "flex";
    buildSlides(list);
    updateSlide(list);
  }

  function updateSlide(list) {
    document.getElementById("fotos-slides").querySelectorAll("img")
      .forEach((img, i) => img.classList.toggle("active", i === current));
    document.getElementById("fotos-dots").querySelectorAll(".fotos-dot")
      .forEach((d, i) => d.classList.toggle("active", i === current));
    document.getElementById("fotos-title").textContent = list[current]?.title || "";
  }

  function next() {
    if (!photos.length) return;
    current = (current + 1) % photos.length;
    updateSlide(photos);
  }

  function startSlideTimer() {
    if (slideTimer) clearInterval(slideTimer);
    if (photos.length > 1) slideTimer = setInterval(next, slideInterval);
  }

  render(photos);
  startSlideTimer();

  // Alle 5 Minuten prüfen — nur neu aufbauen wenn sich IDs geändert haben
  setInterval(async () => {
    const fresh = await loadPhotos();
    const oldIds = photos.map(p => p.id).join(",");
    const newIds = fresh.map(p => p.id).join(",");
    if (oldIds !== newIds) {
      photos = fresh;
      current = 0;
      render(photos);
      startSlideTimer();
    }
  }, 5 * 60 * 1000);
}

// ── AFFEN-EASTER-EGG ──────────────────────────────────────────────────────
(function () {
  const ALLE_MINUTEN = 10;  // Wie oft erscheint der Affe? (in Minuten)

    css.textContent = `
      #affe-wrap {
        position:fixed; bottom:0; right:-160px; width:120px; height:180px;
        z-index:9999; pointer-events:none;
        transition: right 0.9s cubic-bezier(0.34,1.15,0.64,1);
      }
      #affe-wrap.in  { right: 18px; }
      #affe-wrap.out { right:-160px; transition:right 0.8s ease-in; }

      @keyframes aw { 0%,100%{transform:rotate(0deg)} 35%{transform:rotate(-85deg)} 70%{transform:rotate(-20deg)} }
      @keyframes ak { 0%,100%{transform:rotate(0deg)} 45%{transform:rotate(40deg)} }
      @keyframes aj { 0%,100%{transform:translateY(0)} 45%{transform:translateY(-50px)} }
      @keyframes at { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(22deg)} }
      @keyframes ab { 0%,88%,100%{transform:scaleY(1)} 94%{transform:scaleY(0.1)} }

      .affe-arm-l { transform-box:fill-box; transform-origin:right center; }
      .affe-arm-r { transform-box:fill-box; transform-origin:left center; }
      .affe-tail  { transform-box:fill-box; transform-origin:0% 100%; animation:at 0.9s ease-in-out infinite; }
      .affe-eye   { transform-box:fill-box; transform-origin:center; animation:ab 3.5s ease-in-out infinite; }

      .affe-wave  .affe-arm-l { animation:aw 0.7s ease-in-out 3; }
      .affe-knock .affe-arm-r { animation:ak 0.38s ease-in-out 5; }
      .affe-jump              { animation:aj 0.45s ease-in-out 3; }
    `;
    document.head.appendChild(css);

    const wrap = document.createElement('div');
    wrap.id = 'affe-wrap';
    wrap.innerHTML = `<svg viewBox="0 0 120 180" xmlns="http://www.w3.org/2000/svg" width="120" height="180">
      <defs>
        <radialGradient id="ag1" cx="38%" cy="32%">
          <stop offset="0%" stop-color="#C87D3B"/><stop offset="100%" stop-color="#8B5832"/>
        </radialGradient>
        <radialGradient id="ag2" cx="38%" cy="32%">
          <stop offset="0%" stop-color="#F5C9A0"/><stop offset="100%" stop-color="#D4A574"/>
        </radialGradient>
      </defs>

      <!-- Schwanz -->
      <path class="affe-tail" d="M70 152 Q98 160 104 140 Q112 116 88 110"
            stroke="#7A4F2A" stroke-width="9" fill="none" stroke-linecap="round"/>

      <!-- Körper -->
      <ellipse cx="58" cy="120" rx="29" ry="34" fill="url(#ag1)"/>
      <ellipse cx="58" cy="123" rx="17" ry="21" fill="url(#ag2)"/>

      <!-- Linker Arm + Tennisschläger (winken) -->
      <g class="affe-arm-l">
        <rect x="10" y="90" width="27" height="11" rx="5.5" fill="#8B5832"/>
        <circle cx="9" cy="95" r="8" fill="url(#ag2)"/>
        <ellipse cx="-2" cy="95" rx="11" ry="15" stroke="#4ADE80" stroke-width="2.5" fill="none"/>
        <line x1="-2" y1="80" x2="-2" y2="110" stroke="#4ADE80" stroke-width="1.2" opacity="0.7"/>
        <line x1="-13" y1="95" x2="9"  y2="95"  stroke="#4ADE80" stroke-width="1.2" opacity="0.7"/>
        <rect x="-5" y="108" width="6" height="11" rx="3" fill="#222" opacity="0.8"/>
      </g>

      <!-- Rechter Arm (klopfen) -->
      <g class="affe-arm-r">
        <rect x="83" y="90" width="27" height="11" rx="5.5" fill="#8B5832"/>
        <circle cx="111" cy="95" r="8" fill="url(#ag2)"/>
        <line x1="107" y1="91" x2="107" y2="99" stroke="#C8A070" stroke-width="1" opacity="0.5"/>
        <line x1="111" y1="91" x2="111" y2="99" stroke="#C8A070" stroke-width="1" opacity="0.5"/>
        <line x1="115" y1="91" x2="115" y2="99" stroke="#C8A070" stroke-width="1" opacity="0.5"/>
      </g>

      <!-- Beine -->
      <rect x="39" y="147" width="16" height="22" rx="8" fill="#7A4F2A"/>
      <ellipse cx="47" cy="170" rx="10" ry="5" fill="#5A3518"/>
      <rect x="63" y="147" width="16" height="22" rx="8" fill="#7A4F2A"/>
      <ellipse cx="71" cy="170" rx="10" ry="5" fill="#5A3518"/>

      <!-- Kopf -->
      <circle cx="58" cy="53" r="36" fill="url(#ag1)"/>
      <!-- Ohren -->
      <circle cx="21" cy="53" r="14" fill="url(#ag1)"/>
      <circle cx="21" cy="53" r="9"  fill="url(#ag2)"/>
      <circle cx="95" cy="53" r="14" fill="url(#ag1)"/>
      <circle cx="95" cy="53" r="9"  fill="url(#ag2)"/>
      <!-- Schnauze -->
      <ellipse cx="58" cy="69" rx="21" ry="16" fill="url(#ag2)"/>
      <!-- Augen -->
      <circle cx="46" cy="48" r="9" fill="white"/>
      <circle cx="70" cy="48" r="9" fill="white"/>
      <ellipse class="affe-eye" cx="48" cy="49" rx="5" ry="5" fill="#1a0a00"/>
      <ellipse class="affe-eye" cx="72" cy="49" rx="5" ry="5" fill="#1a0a00"/>
      <circle cx="49" cy="47" r="2" fill="white"/>
      <circle cx="73" cy="47" r="2" fill="white"/>
      <!-- Stirn-Detail -->
      <path d="M37 37 Q58 27 79 37" stroke="#7A4F2A" stroke-width="2.5" fill="none" opacity="0.4" stroke-linecap="round"/>
      <!-- Nase -->
      <ellipse cx="58" cy="64" rx="7" ry="4.5" fill="#6B3A1F"/>
      <circle cx="54" cy="63" r="2.5" fill="#4A2010"/>
      <circle cx="62" cy="63" r="2.5" fill="#4A2010"/>
      <!-- Lächeln + Zähne -->
      <path d="M47 75 Q58 87 69 75" stroke="#7A3A1F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M51 75 Q58 81 65 75" fill="white" opacity="0.8"/>
    </svg>`;
    document.body.appendChild(wrap);

    let stolen = null;
    const after = (ms, fn) => setTimeout(fn, ms);

    after(50*t,   () => wrap.classList.add('in'));
    after(1100*t, () => wrap.classList.add('affe-wave'));
    after(3300*t, () => wrap.classList.remove('affe-wave'));

    after(3800*t, () => {
      wrap.classList.add('affe-knock');
      let s = 0;
      const shake = setInterval(() => {
        document.body.style.transform = s++ % 2 ? 'translateX(3px)' : 'translateX(-3px)';
        if (s > 8) { clearInterval(shake); document.body.style.transform = ''; }
      }, 60);
    });
    after(5800*t, () => wrap.classList.remove('affe-knock'));

    after(6200*t, () => wrap.classList.add('affe-jump'));
    after(7700*t, () => wrap.classList.remove('affe-jump'));

    after(8000*t, () => {
      const selectors = ['.logo-title', '#hs-team', '#date-display', '.hs-team-name'];
      let target = null;
      for (const sel of selectors) {
        const el = document.querySelector(sel);
        if (el && el.offsetParent !== null && el.textContent.trim().length > 4) {
          target = el; break;
        }
      }
      if (!target) return;

      const origText = target.textContent;
      const letter   = origText[origText.length - 1];
      target.textContent = origText.slice(0, -1);

      const tRect   = target.getBoundingClientRect();
      const wRect   = wrap.getBoundingClientRect();
      const cs      = getComputedStyle(target);
      const floater = document.createElement('div');
      floater.textContent = letter;
      Object.assign(floater.style, {
        position: 'fixed', left: tRect.right - 12 + 'px', top: tRect.top + 'px',
        fontSize: cs.fontSize, color: cs.color, fontWeight: cs.fontWeight,
        fontFamily: cs.fontFamily, zIndex: '10000', pointerEvents: 'none',
        transition: 'left 0.65s ease-in, top 0.65s ease-in, transform 0.65s',
        transform: 'scale(1)',
      });
      document.body.appendChild(floater);
      after(30, () => {
        floater.style.left      = wRect.left + 55 + 'px';
        floater.style.top       = wRect.top  + 65 + 'px';
        floater.style.transform = 'scale(0.55) rotate(-15deg)';
      });
      stolen = { target, origText, floater };
    });

    after(9400*t, () => {
      wrap.classList.remove('in');
      wrap.classList.add('out');
      if (stolen?.floater) {
        stolen.floater.style.transition = 'left 0.8s ease-in, top 0s, transform 0s';
        stolen.floater.style.left = '-200px';
      }
    });

    after(10500*t, () => {
      if (stolen) { stolen.target.textContent = stolen.origText; stolen.floater.remove(); }
      wrap.remove();
      css.remove();
    });
  }

  setTimeout(function tick() { showMonkey(); setTimeout(tick, INTERVAL_MS); }, INTERVAL_MS);
})();

// ── MIDNIGHT RELOAD ───────────────────────────────────────────────────────
function scheduleMidnightReload() {
  const now  = new Date();
  const next = new Date(now);
  next.setHours(24, 0, 5, 0);
  const msUntil = next - now;
  setTimeout(() => location.reload(), msUntil);
}

// ── INIT ──────────────────────────────────────────────────────────────────
(async function init() {
  const { data: settingsData } = await sb.from("settings").select("*")
    .in("key", ["display_mode","display_theme","display_vereinsnummer","display_saison",
                "display_bild_url","display_mannschaft","display_gegner",
                "display_sched_schedule","display_sched_heimspiel","display_sched_bild",
                "display_foto_interval"]);
  const settings    = Object.fromEntries((settingsData || []).map(r => [r.key, r.value]));

  // Zeitschaltung: prüfen ob ein Modus gerade aktiv ist
  const now = new Date();
  const parseSchedule = (key) => { try { return JSON.parse(settings[key]||"{}"); } catch(_){ return {}; } };
  const schedMap = {
    schedule:  parseSchedule("display_sched_schedule"),
    heimspiel: parseSchedule("display_sched_heimspiel"),
    bild:      parseSchedule("display_sched_bild"),
  };
  const schedActive = Object.entries(schedMap).find(([,s]) =>
    s.from && s.to && now >= new Date(s.from) && now <= new Date(s.to)
  );
  const displayMode  = schedActive ? schedActive[0] : (settings.display_mode || "schedule");
  const displayTheme = settings.display_theme         || "dark";
  const vereinsnr    = settings.display_vereinsnummer || "06085";
  const saison       = settings.display_saison        || "2026";
  const mannschaft   = settings.display_mannschaft    || "";
  const gegner       = settings.display_gegner        || "";
  const bildUrl      = settings.display_bild_url      || "";
  const fotoInterval = Number(settings.display_foto_interval) || 8;

  // Theme gilt für alle Modi – immer zuerst setzen
  if (displayTheme === "light")    document.body.classList.add("theme-light");
  if (displayTheme === "contrast") document.body.classList.add("theme-contrast");

  document.getElementById("loading").style.display = "none";

  startSettingsPolling(displayMode, displayTheme, vereinsnr, saison, mannschaft, gegner);

  // Weißer Bildschirm (legacy)
  if (displayMode === "white") {
    document.getElementById("white-screen").style.display = "block";
    return;
  }

  // Fotos-Slideshow
  if (displayMode === "fotos") {
    startFotosModus(fotoInterval);
    scheduleMidnightReload();
    return;
  }

  // Bildanzeige
  if (displayMode === "bild") {
    const screen = document.getElementById("bild-screen");
    screen.style.display = "flex";
    if (bildUrl) {
      const img = document.getElementById("bild-img");
      img.src = bildUrl;
      img.style.display = "block";
    }
    updateBildClock();
    setInterval(updateBildClock, 30_000);
    scheduleMidnightReload();
    return;
  }

  // Heimspielmodus
  if (displayMode === "heimspiel") {
    startHeimspielmodus();
    scheduleMidnightReload();
    return;
  }

  // Tagesbelegungsplan (Standard)
  updateClock();
  setInterval(updateClock, 30_000);

  await loadData();
  setInterval(loadData, 60_000);

  subscribeRealtime();
  scheduleMidnightReload();

  document.getElementById("app").style.display = "flex";
})();
</script>
