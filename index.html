<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tennis Herrieden</title>
    <link rel="manifest" href="/manifest.json"/>
    <meta name="theme-color" content="#22C55E"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="Tennis HRI"/>
    <link rel="apple-touch-icon" href="/icon.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* ── DESIGN TOKENS: Dark (Standard) ── */
      :root {
        --bg-page:        #0F172A;
        --bg-card:        #1E293B;
        --bg-border:      #334155;
        --bg-input:       #0F172A;
        --text-primary:   #F1F5F9;
        --text-secondary: #94A3B8;
        --text-muted:     #64748B;
        --text-on-accent: #F1F5F9;
        --glow-color:     #22C55E14;
      }
      /* ── DESIGN TOKENS: Hell ── */
      :root.theme-light {
        --bg-page:        #F1F5F9;
        --bg-card:        #FFFFFF;
        --bg-border:      #E2E8F0;
        --bg-input:       #F8FAFC;
        --text-primary:   #0F172A;
        --text-secondary: #475569;
        --text-muted:     #94A3B8;
        --text-on-accent: #FFFFFF;
        --glow-color:     #22C55E0A;
      }
      /* ── DESIGN TOKENS: French Open (Roland Garros) ── */
      :root.theme-frenchopen {
        --bg-page:        #1A0700;
        --bg-card:        #2D1005;
        --bg-border:      #C1440E;
        --bg-input:       #0F0300;
        --text-primary:   #FFF0E5;
        --text-secondary: #D4956A;
        --text-muted:     #8A5040;
        --text-on-accent: #FFFFFF;
        --glow-color:     #C1440E18;
      }
      /* ── DESIGN TOKENS: Australian Open ── */
      :root.theme-australianopen {
        --bg-page:        #021018;
        --bg-card:        #082535;
        --bg-border:      #0087C2;
        --bg-input:       #01080F;
        --text-primary:   #EFF8FF;
        --text-secondary: #B3D234;
        --text-muted:     #4A8FB5;
        --text-on-accent: #FFFFFF;
        --glow-color:     #0087C218;
      }
      /* ── DESIGN TOKENS: US Open ── */
      :root.theme-usopen {
        --bg-page:        #020B1A;
        --bg-card:        #0A1E3D;
        --bg-border:      #4472C4;
        --bg-input:       #010511;
        --text-primary:   #EFF4FF;
        --text-secondary: #F7C335;
        --text-muted:     #4A6BA5;
        --text-on-accent: #FFFFFF;
        --glow-color:     #4472C418;
      }
      /* ── DESIGN TOKENS: Wimbledon (Grün/Lila) ── */
      :root.theme-wimbledon {
        --bg-page:        #021209;
        --bg-card:        #0A2B17;
        --bg-border:      #006747;
        --bg-input:       #010A04;
        --text-primary:   #F0FFF8;
        --text-secondary: #9B8EC4;
        --text-muted:     #4D8A6A;
        --text-on-accent: #FFFFFF;
        --glow-color:     #00674718;
      }
      * { margin:0; padding:0; box-sizing:border-box; }
      body { font-family: 'DM Sans', sans-serif; background: var(--bg-page); }

      /* ── DESKTOP LAYOUT (≥768px) ── */
      @media(min-width:768px) {
        .h-inner {
          max-width: 1400px !important;
          padding: 40px 48px 48px !important;
        }
        .h-cols {
          display: flex !important;
          gap: 24px;
          align-items: flex-start;
        }
        .h-filter {
          width: 220px !important;
          flex-shrink: 0 !important;
          flex-direction: column !important;
          position: sticky !important;
          top: 24px !important;
          margin: 0 !important;
          overflow-x: visible !important;
        }
        .h-content {
          flex: 1 !important;
          min-width: 0 !important;
          display: flex !important;
          flex-direction: column !important;
          gap: 16px !important;
        }
      }
      /* ── MOBILE: Filter-Tabs ohne Scrollbalken ── */
      @media(max-width:767px) {
        .h-inner { gap: 10px !important; }
        .h-filter { scrollbar-width: none !important; }
        .h-filter::-webkit-scrollbar { display: none !important; }
      }
      /* ── DEV: Force Mobile ── */
      html.force-mobile .h-inner {
        max-width: 480px !important;
        padding: 52px 0 32px !important;
        gap: 10px !important;
      }
      html.force-mobile .h-cols {
        display: block !important;
        gap: 0 !important;
      }
      html.force-mobile .h-filter {
        width: auto !important; position: static !important;
        flex-direction: row !important; overflow-x: auto !important;
        margin: 0 !important;
        scrollbar-width: none !important;
      }
      html.force-mobile .h-filter::-webkit-scrollbar { display: none !important; }
      html.force-mobile .h-content {
        flex: none !important;
        width: 100% !important;
        display: block !important;
        min-width: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function(){
        const t=localStorage.getItem("app-theme");
        const map={"light":"theme-light","frenchopen":"theme-frenchopen","australianopen":"theme-australianopen","usopen":"theme-usopen","wimbledon":"theme-wimbledon"};
        if(map[t]) document.documentElement.classList.add(map[t]);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
      }
    </script>
  </body>
</html>
